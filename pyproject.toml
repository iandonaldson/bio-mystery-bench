[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bio-mystery-bench"
version = "0.1.0"
description = "Evaluation harness for the Anthropic BioMysteryBench bioinformatics benchmark"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.49.0",
    "docker>=7.0",
    "datasets>=2.19",
    "huggingface-hub>=0.23",
    "pydantic>=2.0",
    "rich>=13.0",
    "click>=8.0",
    "python-dotenv>=1.0",
]

[project.scripts]
run-eval = "scripts.run_eval:main"
report = "scripts.report:main"

[tool.hatch.build.targets.wheel]
packages = ["harness", "scripts"]
